spring:
  application:
    name: api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${API_PORT:8080}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  media:
    dir: ${MEDIA_DIR:./uploads/media}
  admin:
    user: ${ADMIN_USER:admin}
    password: ${ADMIN_PASSWORD:admin}
  github:
    api-url: ${GITHUB_API_URL:https://api.github.com}
    token: ${GITHUB_TOKEN:}
    sync-interval: ${GITHUB_SYNC_INTERVAL:3600000} # 1 hora em ms

springdoc:
  swagger-ui:
    url: /openapi.yaml

---
# Perfil DEV e LOCAL
spring:
  config:
    activate:
      on-profile: "dev | local"
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:fbw}}}
    username: ${DB_USER:${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:fbw}}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:fb123}}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

---
# Perfil PROD
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL}}
    username: ${DB_USER:${SPRING_DATASOURCE_USERNAME}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
