spring.application.name=api
server.port=${API_PORT:8080}
springdoc.swagger-ui.url=/openapi.yaml

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:fbw}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:fbw}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:change-me}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
